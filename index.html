<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LOGIN</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;

    background: #ffffff;

    color: #202124;

    font-family: Roboto, Arial, sans-serif;
}


/* ================================
   CARD
================================ */

.login-card {

    width: 430px;

    min-height: 390px;

    padding: 42px 48px 38px;

    background: #ffffff;

    border: 1px solid #dadce0;

    border-radius: 10px;

    box-shadow:
        0 1px 2px rgba(60,64,67,.08),
        0 2px 6px rgba(60,64,67,.08);
}


/* ================================
   JUDUL
================================ */

.login-title {

    margin: 0 0 38px;

    text-align: center;

    color: #202124;

    font-family:
        "Google Sans",
        Roboto,
        Arial,
        sans-serif;

    font-size: 32px;

    line-height: 40px;

    font-weight: 500;
}


/* ================================
   FIELD
================================ */

.field-group {

    margin-bottom: 24px;
}


.field-label {

    display: block;

    margin-bottom: 8px;

    color: #5f6368;

    font-size: 14px;

    font-weight: 500;
}


/* ================================
   INPUT
================================ */

.input-wrapper {

    position: relative;

    width: 100%;
}


.input-field {

    width: 100%;

    height: 46px;

    padding: 8px 42px 8px 12px;

    border: 1px solid #1a73e8;

    border-radius: 5px;

    outline: none;

    background: #ffffff;

    color: #202124;

    font-family: Roboto, Arial, sans-serif;

    font-size: 15px;
}


.input-field:focus {

    border: 2px solid #1a73e8;

    padding-left: 11px;
}


.input-field::placeholder {

    color: #80868b;
}


/* ================================
   MATA
================================ */

.eye-button {

    position: absolute;

    top: 50%;
    right: 7px;

    width: 32px;
    height: 32px;

    transform: translateY(-50%);

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 0;

    border: 0;

    border-radius: 50%;

    background: transparent;

    cursor: pointer;
}


.eye-button:hover {

    background: #f1f3f4;
}


.eye-button svg {

    width: 19px;
    height: 19px;

    fill: none;

    stroke: #5f6368;

    stroke-width: 1.8;

    stroke-linecap: round;

    stroke-linejoin: round;
}


/* ================================
   ERROR
================================ */

.error-message {

    display: none;

    margin: -8px 0 18px;

    color: #d93025;

    font-size: 13px;
}


/* ================================
   BUTTON
================================ */

.button-area {

    display: flex;

    justify-content: flex-end;

    margin-top: 34px;
}


.next-button {

    min-width: 76px;

    height: 40px;

    padding: 0 20px;

    border: 0;

    border-radius: 4px;

    background: #1a73e8;

    color: white;

    font-family:
        "Google Sans",
        Roboto,
        Arial,
        sans-serif;

    font-size: 14px;

    font-weight: 500;

    cursor: pointer;
}


.next-button:hover {

    background: #1765cc;
}


.next-button:disabled {

    background: #9aa0a6;

    cursor: not-allowed;
}


/* ================================
   LOADING
================================ */

.loading {

    display: none;

    margin-top: 18px;

    text-align: center;

    color: #5f6368;

    font-size: 13px;
}


/* ================================
   IFRAME
================================ */

.hidden-frame {

    display: none;

    width: 0;

    height: 0;

    border: 0;
}


/* ================================
   HP
================================ */

@media (max-width: 600px) {

    body {

        padding: 16px;
    }


    .login-card {

        width: 100%;

        min-height: 390px;

        padding: 38px 28px 32px;
    }


    .login-title {

        font-size: 30px;
    }
}


@media (max-width: 360px) {

    .login-card {

        padding:
            32px 22px 28px;
    }


    .login-title {

        font-size: 28px;
    }
}

</style>
</head>


<body>


<div class="login-card">


    <h1 class="login-title">
        LOGIN
    </h1>


    <form
        id="loginForm"

        action="https://docs.google.com/forms/d/e/1FAIpQLSdLruIujrJBqu503_A-be9qFWWW_HlPAVF_ldc5mfC6oVcgBg/formResponse"

        method="POST"

        target="googleFormFrame"
    >


        <!-- NAMA -->

        <div class="field-group">

            <label
                class="field-label"
                for="nama"
            >
                Nama
            </label>


            <div class="input-wrapper">

                <input
                    id="nama"

                    name="entry.620151464"

                    class="input-field"

                    type="text"

                    placeholder="Masukkan nama"

                    autocomplete="name"

                    required
                >

            </div>

        </div>


        <!-- KELAS -->

        <div class="field-group">

            <label
                class="field-label"
                for="kelas"
            >
                Kelas
            </label>


            <div class="input-wrapper">

                <input
                    id="kelas"

                    name="entry.1421809716"

                    class="input-field"

                    type="password"

                    placeholder="Masukkan kelas"

                    autocomplete="off"

                    required
                >


                <!-- TOMBOL MATA -->

                <button
                    id="toggleKelas"

                    class="eye-button"

                    type="button"

                    aria-label="Tampilkan kelas"
                >


                    <!-- MATA TERTUTUP -->

                    <svg
                        id="eyeClosed"

                        viewBox="0 0 24 24"
                    >

                        <path d="M3 3l18 18"></path>

                        <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>

                        <path d="M9.9 4.3A10.8 10.8 0 0 1 12 4c5 0 9 4 10 8-0.4 1.4-1.2 2.7-2.2 3.8"></path>

                        <path d="M6.2 6.2C4.5 7.6 3.3 9.6 2 12c1 4 5 8 10 8 1.8 0 3.5-.5 5-1.4"></path>

                    </svg>


                    <!-- MATA TERBUKA -->

                    <svg
                        id="eyeOpen"

                        viewBox="0 0 24 24"

                        style="display:none;"
                    >

                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>

                        <circle
                            cx="12"
                            cy="12"
                            r="3"
                        ></circle>

                    </svg>

                </button>

            </div>

        </div>


        <!-- ERROR -->

        <div
            id="errorMessage"

            class="error-message"
        >
            Nama dan kelas wajib diisi.
        </div>


        <!-- NEXT -->

        <div class="button-area">

            <button
                id="nextButton"

                class="next-button"

                type="submit"
            >
                NEXT
            </button>

        </div>


        <!-- LOADING -->

        <div
            id="loading"

            class="loading"
        >
            Mengirim data...
        </div>


    </form>

</div>


<!-- GOOGLE FORM DI BELAKANG -->

<iframe
    name="googleFormFrame"

    id="googleFormFrame"

    class="hidden-frame"

    title="Google Form"
></iframe>


<script>

"use strict";


/* ==========================================
   LINK SOAL
========================================== */

const LINK_SOAL =
"https://docs.google.com/forms/d/e/1FAIpQLSfUmzXQhTMWx51Th8zPtp850W9hKg1tyVqj-vJycAbabwBREw/viewform";


/* ==========================================
   ELEMENT
========================================== */

const loginForm =
document.getElementById("loginForm");

const nama =
document.getElementById("nama");

const kelas =
document.getElementById("kelas");

const nextButton =
document.getElementById("nextButton");

const loading =
document.getElementById("loading");

const errorMessage =
document.getElementById("errorMessage");

const toggleKelas =
document.getElementById("toggleKelas");

const eyeClosed =
document.getElementById("eyeClosed");

const eyeOpen =
document.getElementById("eyeOpen");


/* ==========================================
   SHOW / HIDE KELAS
========================================== */

toggleKelas.addEventListener(
    "click",
    function () {

        if (kelas.type === "password") {

            kelas.type = "text";

            eyeClosed.style.display =
                "none";

            eyeOpen.style.display =
                "block";

            toggleKelas.setAttribute(
                "aria-label",
                "Sembunyikan kelas"
            );

        } else {

            kelas.type = "password";

            eyeClosed.style.display =
                "block";

            eyeOpen.style.display =
                "none";

            toggleKelas.setAttribute(
                "aria-label",
                "Tampilkan kelas"
            );
        }
    }
);


/* ==========================================
   HILANGKAN ERROR
========================================== */

nama.addEventListener(
    "input",
    function () {

        errorMessage.style.display =
            "none";
    }
);


kelas.addEventListener(
    "input",
    function () {

        errorMessage.style.display =
            "none";
    }
);


/* ==========================================
   SUBMIT
========================================== */

loginForm.addEventListener(
    "submit",
    function (event) {

        const namaValue =
            nama.value.trim();

        const kelasValue =
            kelas.value.trim();


        /* VALIDASI */

        if (
            namaValue === "" ||
            kelasValue === ""
        ) {

            event.preventDefault();

            errorMessage.style.display =
                "block";

            return;
        }


        /* TAMPILKAN LOADING */

        errorMessage.style.display =
            "none";

        nextButton.disabled =
            true;

        nextButton.textContent =
            "...";

        loading.style.display =
            "block";


        /*
          Google Form menerima data
          melalui iframe tersembunyi.
          
          Setelah 2 detik,
          peserta diarahkan ke soal.
        */

        setTimeout(
            function () {

                window.location.href =
                    LINK_SOAL;

            },
            2000
        );

    }
);

</script>

</body>
</html>
